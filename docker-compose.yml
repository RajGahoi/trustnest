services:
  trustnest-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustnest_marketplace
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=trustnest_super_secure_jwt_secret_key_2026_xyz!
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:5173,http://localhost:4000,http://localhost:3000
      - DATABASE_PATH=data/trustnest.db
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE_MB=10
    volumes:
      - trustnest_db:/app/data
      - trustnest_uploads:/app/uploads

volumes:
  trustnest_db:
    driver: local
  trustnest_uploads:
    driver: local
