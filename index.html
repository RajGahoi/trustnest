<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#073F59" />
    <meta name="description" content="TrustNest — The Trust-First Classified Marketplace Platform. Real Estate, Vehicles, Mobiles, Electronics, Services & Jobs verified before promoted." />
    <link rel="canonical" href="https://rajgahoi.github.io/trustnest/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rajgahoi.github.io/trustnest/" />
    <meta property="og:title" content="TrustNest — Verified Before Promoted. Beyond Listings." />
    <meta property="og:description" content="Trust-first marketplace for real estate and verified properties across India. Zero spam, transparent pricing, verified RERA certificates, and cryptographic verification." />
    <meta property="og:image" content="https://rajgahoi.github.io/trustnest/real-apartment-view-1.jpg" />
    <meta property="og:site_name" content="TrustNest" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://rajgahoi.github.io/trustnest/" />
    <meta name="twitter:title" content="TrustNest — Verified Before Promoted. Beyond Listings." />
    <meta name="twitter:description" content="Trust-first marketplace for real estate and verified properties across India. Zero spam, transparent pricing, verified RERA certificates, and cryptographic verification." />
    <meta name="twitter:image" content="https://rajgahoi.github.io/trustnest/real-apartment-view-1.jpg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TrustNest",
        "url": "https://rajgahoi.github.io/trustnest/",
        "description": "The Trust-First Classified Marketplace Platform with zero-spam verified listings across India.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://rajgahoi.github.io/trustnest/#search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <title>TrustNest — Verified Before Promoted. Beyond Listings.</title>
  </head>
  <body class="bg-cream-100 text-navy-900 font-sans antialiased selection:bg-orange-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
